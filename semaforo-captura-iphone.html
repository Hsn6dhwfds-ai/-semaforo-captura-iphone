<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semáforo Captura iPhone</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:700px;margin:auto;padding:20px 16px 40px}h1{text-align:center}
button,label{display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:18px;background:#fff;color:#111;font-size:18px;font-weight:700;text-align:center}
input[type=file]{display:none}.preview{display:none;width:100%;max-height:360px;object-fit:contain;border-radius:18px}
#status{text-align:center;color:#aaa;min-height:25px}
#result{margin-top:15px;height:190px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:900;background:#333}
.green{background:#08783d!important}.yellow{background:#9b8a00!important}.orange{background:#b65300!important}.red{background:#8b1111!important}
.card{background:#1d1d1f;border-radius:20px;padding:16px;margin-top:15px}
.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #333}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{padding:13px;border-radius:12px;border:1px solid #555;background:#111;color:#fff;font-size:18px}
.small{color:#aaa;font-size:14px;line-height:1.4}
</style></head><body><main>
<h1>🚦 Semáforo Captura</h1>
<p style="text-align:center;color:#aaa">Elige una captura de Uber o DiDi</p>
<label for="photo">📸 Elegir captura</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview">
<div id="status">Listo para analizar.</div>
<div id="result">—</div>
<div class="card">
<div class="row"><span>Pago</span><b id="pay">—</b></div>
<div class="row"><span>Tiempo total</span><b id="mins">—</b></div>
<div class="row"><span>Km totales</span><b id="kms">—</b></div>
</div>
<div class="card">
<p class="small">Si el OCR falla, corrige los datos aquí:</p>
<div class="grid">
<input id="mpay" type="number" step="0.01" placeholder="Pago">
<input id="mmins" type="number" placeholder="Minutos">
<input id="mkms" type="number" step="0.1" placeholder="Km">
</div>
<button id="calc">Calcular color</button>
</div>
<p class="small">Usa tu tabla de rentabilidad. Pago y kilómetros deben cumplir el nivel correspondiente.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const T=[
[5,25,2,21,2,18,2,17,1],[10,50,4,42,4,36,4,34,3],
[15,75,6,63,6,54,6,50,5],[20,100,9,84,8,72,8,67,7],
[25,125,11,105,10,90,10,84,9],[30,150,13,125,12,108,12,100,11],
[35,175,15,146,14,126,14,117,13],[40,200,18,167,16,144,16,134,14],
[45,225,20,188,18,162,18,150,16],[50,250,22,209,20,180,20,167,18],
[55,275,25,230,23,198,22,184,20],[60,300,27,250,25,215,23,200,22]];
function sem(pay,min,km){
 const r=T.find(x=>min<=x[0]); if(!r)return"🔴";
 if(pay>=r[1]&&km<=r[2])return"🟢";
 if(pay>=r[3]&&km<=r[4])return"🟢";
 if(pay>=r[5]&&km<=r[6])return"🟡";
 if(pay>=r[7]&&km<=r[8])return"🟠";
 return"🔴";
}
function show(p,m,k){
 document.querySelector("#pay").textContent=p?"$"+p.toFixed(2):"—";
 document.querySelector("#mins").textContent=m?m+" min":"—";
 document.querySelector("#kms").textContent=k?k.toFixed(1)+" km":"—";
 const r=document.querySelector("#result"); r.textContent=p&&m&&k?sem(p,m,k):"—";
 r.className=p&&m&&k?({"🟢":"green","🟡":"yellow","🟠":"orange","🔴":"red"}[sem(p,m,k)]):"";
 document.querySelector("#mpay").value=p||"";
 document.querySelector("#mmins").value=m||"";
 document.querySelector("#mkms").value=k||"";
}
function parse(t){
 t=t.replace(/,/g,".").replace(/\s+/g," ");
 let a=[...t.matchAll(/(?:MXN|MX|\$)\s*([0-9]{1,5}(?:\.[0-9]{1,2})?)/gi)].map(x=>+x[1]);
 if(!a.length)a=[...t.matchAll(/\b([0-9]{2,5}\.[0-9]{1,2})\b/g)].map(x=>+x[1]);
 let pairs=[...t.matchAll(/(\d{1,3})\s*min(?:utos)?\s*\(\s*([0-9]+(?:\.[0-9]+)?)\s*km/gi)];
 let m=0,k=0;
 pairs.forEach(x=>{m+=+x[1];k+=+x[2]});
 if(!pairs.length){
  let ms=[...t.matchAll(/\b(\d{1,3})\s*min(?:utos)?\b/gi)].map(x=>+x[1]);
  let ks=[...t.matchAll(/\b([0-9]+(?:\.[0-9]+)?)\s*km\b/gi)].map(x=>+x[1]);
  m=ms.slice(0,2).reduce((a,b)=>a+b,0); k=ks.slice(0,2).reduce((a,b)=>a+b,0);
 }
 return[a[0]||0,m,k];
}
document.querySelector("#photo").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const im=document.querySelector("#preview");im.src=URL.createObjectURL(f);im.style.display="block";
 document.querySelector("#status").textContent="Leyendo oferta…";
 try{
  const q=await Tesseract.recognize(f,"eng",{logger:x=>{
   if(x.status==="recognizing text")document.querySelector("#status").textContent="Leyendo… "+Math.round(x.progress*100)+"%";
  }});
  const [p,m,k]=parse(q.data.text);show(p,m,k);
  document.querySelector("#status").textContent=p&&m&&k?"Listo.":"No pude leer todo; corrígelo abajo.";
 }catch(err){document.querySelector("#status").textContent="OCR no disponible; introduce los datos abajo."}
};
document.querySelector("#calc").onclick=()=>show(
 +document.querySelector("#mpay").value,
 +document.querySelector("#mmins").value,
 +document.querySelector("#mkms").value);
</script></body></html>
